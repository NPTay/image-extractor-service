version: "3.9"

services:
  image-extractor:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-extractor:latest
    container_name: image-extractor
    ports:
      - "${PORT:-8002}:8002"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
